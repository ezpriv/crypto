name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Lockfile CVEs, committed secrets and workflow misconfig. Trivy >= 0.72 parses
  # pnpm 12's multi-document lockfile.
  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - &checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - &pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - &node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - &install
        run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check-pins

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - *checkout
      - *pnpm
      - *node
      - *install
      # The examples import the package by name, which resolves to dist/.
      - run: pnpm build
      - run: pnpm check-types
      - run: pnpm test
      - run: pnpm examples

  swift:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - *checkout
      - run: swift test
        working-directory: ports/swift

  # The one check to require on main: it fails unless every job above succeeded.
  ci:
    if: always()
    needs: [trivy, lint, test, swift]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
