name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Runs the dependency tree (install, tests, build) with no publish rights.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: npm pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: "*.tgz"
          if-no-files-found: error

  # Holds the npm token and runs nothing from the repository or its dependencies.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - name: Publish if this version isn't on npm yet
        run: |
          tarball=$(ls ./*.tgz)
          version=$(tar -xOf "$tarball" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          if npm view "@ezpriv/crypto@$version" version >/dev/null 2>&1; then
            echo "@ezpriv/crypto@$version is already published"
          else
            npm publish "$tarball" --access public --ignore-scripts
          fi
